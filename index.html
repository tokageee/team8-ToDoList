<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDoリスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>ToDoリスト</h1>
  </header>

  <main class="container">
    <!-- 入力欄 -->
    <form class="todo-form" onsubmit="return false;">
      <div class="field">
        <label for="title">タイトル</label>
        <input type="text" id="title" placeholder="例：ログイン画面を作る">
      </div>
      <div class="field">
        <label for="assignee">担当者</label>
        <input type="text" id="assignee" placeholder="例：田中">
      </div>
      <div class="field">
        <label for="due">期限</label>
        <input type="date" id="due">
      </div>
      <button type="submit" class="add-button">追加</button>
    </form>

    <!-- 3列のボード -->
    <section class="board">
      <div class="column" id="todo">
        <h2 class="column-title">未着手</h2>
        <div class="card-list"></div>
      </div>

      <div class="column" id="doing">
        <h2 class="column-title">作業中</h2>
        <div class="card-list"></div>
      </div>

      <div class="column" id="done">
        <h2 class="column-title">完了</h2>
        <div class="card-list"></div>
      </div>
    </section>
  </main>
</body>
</html>
